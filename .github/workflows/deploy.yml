name: Deploy BNS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull main on live server
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: GH_TOKEN
          script: |
            set -e
            APP_USER="businessnavachar"
            APP_DIR="/home/${APP_USER}/bnswebsite"
            echo "SSH user=$(whoami)"

            git config --global --add safe.directory "$APP_DIR" || true

            PULL_CMD="cd '$APP_DIR' && git fetch --depth=1 https://x-access-token:${GH_TOKEN}@github.com/testingvikesh/bnswebsite.git main && git reset --hard FETCH_HEAD && php artisan optimize:clear && git log -1 --oneline"

            if [ "$(id -u)" = "0" ]; then
              sudo -u "$APP_USER" -H env GH_TOKEN="$GH_TOKEN" bash -lc "$PULL_CMD"
              chown -R "${APP_USER}:${APP_USER}" "$APP_DIR" || true
            else
              bash -lc "$PULL_CMD"
            fi

            echo "Deploy finished"
