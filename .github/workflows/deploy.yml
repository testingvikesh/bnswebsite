name: Deploy BNS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Pull main on live server
        id: ssh_deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          envs: GH_TOKEN
          script_path: scripts/remote-pull.sh

      - name: Retry pull if first SSH attempt failed
        if: steps.ssh_deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          envs: GH_TOKEN
          script_path: scripts/remote-pull.sh
