name: Deploy BNS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project files to live server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "app,bootstrap,config,database,public,resources,routes,scripts,artisan,composer.json,composer.lock"
          target: "/home/businessnavachar/bnswebsite"
          overwrite: true

      - name: Clear Laravel cache on live server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            APP_USER="businessnavachar"
            APP_DIR="/home/${APP_USER}/bnswebsite"

            echo "Connected as $(whoami)@$(hostname)"
            echo "Title file:"
            grep "<title>" "${APP_DIR}/resources/views/layouts/front.blade.php" || true

            cd "$APP_DIR"
            php artisan optimize:clear

            chown -R "${APP_USER}:${APP_USER}" \
              "${APP_DIR}/app" \
              "${APP_DIR}/bootstrap" \
              "${APP_DIR}/config" \
              "${APP_DIR}/database" \
              "${APP_DIR}/public" \
              "${APP_DIR}/resources" \
              "${APP_DIR}/routes" \
              "${APP_DIR}/scripts" \
              "${APP_DIR}/bootstrap/cache" \
              "${APP_DIR}/storage" || true

            echo "Deploy finished"
