name: Deploy BNS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Upload files to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "app,bootstrap,config,database,public,resources,routes,scripts,artisan,composer.json,composer.lock"
          target: "/tmp/bnswebsite-release"
          overwrite: true
          rm: true

      - name: Publish staging to live and clear cache
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            APP_USER="businessnavachar"
            APP_DIR="/home/${APP_USER}/bnswebsite"
            STAGE="/tmp/bnswebsite-release"

            echo "Connected as $(whoami)@$(hostname)"
            echo "Staging:"
            ls -la "$STAGE"

            copy_live() {
              if command -v rsync >/dev/null 2>&1; then
                rsync -a "$STAGE/" "$APP_DIR/"
              else
                cp -a "$STAGE"/. "$APP_DIR"/
              fi
            }

            if [ "$(id -u)" = "0" ]; then
              copy_live
              chown -R "${APP_USER}:${APP_USER}" "$APP_DIR"
              sudo -u "$APP_USER" -H bash -lc "cd '$APP_DIR' && php artisan optimize:clear"
            else
              if ! copy_live; then
                echo "Direct copy failed; trying sudo"
                sudo rsync -a "$STAGE/" "$APP_DIR/"
                sudo chown -R "${APP_USER}:${APP_USER}" "$APP_DIR"
              fi
              cd "$APP_DIR"
              php artisan optimize:clear
            fi

            rm -rf "$STAGE"
            echo "Title file:"
            grep "<title>" "${APP_DIR}/resources/views/layouts/front.blade.php" || true
            echo "Deploy finished"
