name: Deploy BNS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to cPanel Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            echo "Connected as $(whoami)@$(hostname) HOME=$HOME"

            LIVE_HOME="/home/businessnavachar"
            APP_DIR="${LIVE_HOME}/bnswebsite"

            echo "=== ${LIVE_HOME} ==="
            ls -la "$LIVE_HOME" | head -40

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git repo"
              echo "whoami=$(whoami). Live cPanel user is businessnavachar."
              echo "Set GitHub secret SERVER_USER=businessnavachar"
              exit 1
            fi

            cd "$APP_DIR"
            echo "=== git before ==="
            git remote -v
            git log -1 --oneline

            git fetch origin main
            git reset --hard origin/main

            echo "=== git after ==="
            git log -1 --oneline

            if [ -f scripts/server-deploy.sh ]; then
              bash scripts/server-deploy.sh
            else
              php artisan optimize:clear
            fi

            if [ -f "${LIVE_HOME}/deploy.sh" ]; then
              echo "=== also running ${LIVE_HOME}/deploy.sh ==="
              bash "${LIVE_HOME}/deploy.sh" || echo "WARN: deploy.sh failed"
            fi
