name: Deploy BNS Website

# Manual only. Automatic live updates use cPanel Git (see .cpanel.yml).
# GitHub SSH from Actions was failing (exit 255 / publickey) on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull main on the live server
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: GH_TOKEN
          script: |
            set -e
            APP_USER="businessnavachar"
            APP_DIR="/home/${APP_USER}/bnswebsite"
            echo "SSH user=$(whoami)"

            git config --global --add safe.directory "$APP_DIR"
            cd "$APP_DIR"

            git fetch --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/testingvikesh/bnswebsite.git" main
            git reset --hard FETCH_HEAD

            if [ "$(id -u)" = "0" ]; then
              chown -R "${APP_USER}:${APP_USER}" "$APP_DIR"
              sudo -u "$APP_USER" -H bash -lc "cd '$APP_DIR' && php artisan optimize:clear"
            else
              php artisan optimize:clear
            fi

            grep "<title>" resources/views/layouts/front.blade.php || true
            echo "Deploy finished"
