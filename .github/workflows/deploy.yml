name: Deploy BNS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Make live files writable
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            APP_USER="businessnavachar"
            APP_DIR="/home/${APP_USER}/bnswebsite"

            echo "Connected as $(whoami)@$(hostname)"
            ls -la "${APP_DIR}/app/Providers" || true

            if [ "$(id -u)" = "0" ]; then
              chown -R "${APP_USER}:${APP_USER}" "$APP_DIR"
            elif command -v sudo >/dev/null 2>&1; then
              sudo chown -R "${APP_USER}:${APP_USER}" "$APP_DIR" || true
            fi

            chmod -R u+rwX "$APP_DIR" || true
            echo "Live tree is writable"

      - name: Copy project files to live server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "app,bootstrap,config,database,public,resources,routes,scripts,artisan,composer.json,composer.lock"
          target: "/home/businessnavachar/bnswebsite"
          overwrite: true

      - name: Fix owner and clear Laravel cache
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            APP_USER="businessnavachar"
            APP_DIR="/home/${APP_USER}/bnswebsite"

            if [ "$(id -u)" = "0" ]; then
              chown -R "${APP_USER}:${APP_USER}" "$APP_DIR"
              sudo -u "$APP_USER" -H bash -lc "cd '$APP_DIR' && php artisan optimize:clear"
            else
              cd "$APP_DIR"
              php artisan optimize:clear
            fi

            echo "Title file:"
            grep "<title>" "${APP_DIR}/resources/views/layouts/front.blade.php" || true
            echo "Deploy finished"
