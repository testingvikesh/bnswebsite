name: Deploy BNS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to cPanel Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            APP_USER="businessnavachar"
            LIVE_HOME="/home/${APP_USER}"
            APP_DIR="${LIVE_HOME}/bnswebsite"

            echo "Connected as $(whoami)@$(hostname) HOME=$HOME"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git repo"
              exit 1
            fi

            as_app() {
              if [ "$(id -un)" = "$APP_USER" ]; then
                bash -lc "$*"
              else
                sudo -u "$APP_USER" -H bash -lc "$*"
              fi
            }

            echo "=== git before ==="
            as_app "cd '$APP_DIR' && git remote -v && git log -1 --oneline"

            as_app "cd '$APP_DIR' && git fetch origin main && git reset --hard origin/main"

            echo "=== git after ==="
            as_app "cd '$APP_DIR' && git log -1 --oneline"

            as_app "cd '$APP_DIR' && bash scripts/server-deploy.sh"

            # In case a previous root artisan run left root-owned cache files
            chown -R "${APP_USER}:${APP_USER}" \
              "${APP_DIR}/bootstrap/cache" \
              "${APP_DIR}/storage" || true
